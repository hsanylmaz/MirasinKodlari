name: Deploy Mirasin Kodlari to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build static site and scan arkaplanlar/ folder
        run: npm run build:pages

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.d1.outputs.page_url || steps.d2.outputs.page_url || steps.d3.outputs.page_url || steps.d4.outputs.page_url || steps.d5.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Attempt 1
        id: d1
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Backoff 1 (20s)
        if: steps.d1.outcome == 'failure'
        run: sleep 20

      - name: Deploy Attempt 2
        id: d2
        if: steps.d1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Backoff 2 (30s)
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        run: sleep 30

      - name: Deploy Attempt 3
        id: d3
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Backoff 3 (45s)
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure' && steps.d3.outcome == 'failure'
        run: sleep 45

      - name: Deploy Attempt 4
        id: d4
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure' && steps.d3.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Backoff 4 (60s)
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure' && steps.d3.outcome == 'failure' && steps.d4.outcome == 'failure'
        run: sleep 60

      - name: Deploy Attempt 5 (Final)
        id: d5
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure' && steps.d3.outcome == 'failure' && steps.d4.outcome == 'failure'
        uses: actions/deploy-pages@v5
